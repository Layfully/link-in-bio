name: Azure Static Web Apps CI/CD
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  # A publish in Storyblok: its webhook reaches a relay (README, Deployment), which sends this event, so the content in
  # the first HTML, the cut-down Font Awesome and the page's metadata follow the change. Runs on main, like a push.
  repository_dispatch:
    types: [storyblok_publish]
  # The same by hand, from the Actions tab.
  workflow_dispatch:

# A newer push to the same branch or pull request replaces a run still in progress: the last deploy would win anyway.
# Publishes in Storyblok share the group of main, so several in a row end in one deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Needs no secrets, so it also runs for Dependabot's pull requests and pull requests from forks.
  build_job:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build Job
    env:
      # True when the deploy job runs and publishes the site itself (the same condition as its own). This job then only
      # tests, and leaves the WebAssembly build tools and publishing to it, rather than doing both twice.
      DEPLOYS: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || (github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # app.css is built by hand and committed (see README). A stale copy doesn't fail the run: it would only miss classes
      # added since, so this warns and the deploy goes ahead with the committed file.
      - name: Check that app.css is up to date
        env:
          TAILWIND_VERSION: v4.3.5
          TAILWIND_SHA256: e47695cee3f0d90623a91f3939b08bdee610eb5ad99340adff9d4145b284d6cc
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/tailwindcss" \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/$TAILWIND_VERSION/tailwindcss-linux-x64"
          echo "$TAILWIND_SHA256  $RUNNER_TEMP/tailwindcss" | sha256sum --check --status
          chmod +x "$RUNNER_TEMP/tailwindcss"
          cd Client
          "$RUNNER_TEMP/tailwindcss" --input Styles/app.css --output "$RUNNER_TEMP/app.css" --minify
          if ! cmp --silent "$RUNNER_TEMP/app.css" wwwroot/css/app.css; then
            echo "::warning file=Client/wwwroot/css/app.css::app.css differs from what Tailwind $TAILWIND_VERSION builds from the current sources. Rebuild it as the README describes and commit the result."
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # Without it, publish ships the .NET runtime's WebAssembly file as it comes; with it, the file is relinked for
      # this app and smaller.
      # Also tells the build that they're there (Client.csproj turns on the options that need them).
      - name: Install the WebAssembly build tools
        if: env.DEPLOYS != 'true'
        run: |
          dotnet workload install wasm-tools
          echo "WASM_TOOLS_INSTALLED=true" >> "$GITHUB_ENV"

      # Release, like the deploy: warnings are errors there. Builds the whole solution, then runs the tests.
      - name: Build and test
        run: dotnet test --solution link-in-bio.slnx --configuration Release

      # The particle background, when Blazor starts, the analytics consent and the CSP check; Node comes with the runner,
      # the tests need no packages.
      - name: Test the JavaScript
        run: node --test "Tests/js/*.test.mjs"

      # Publishing does more than building: trimming, fingerprinting and the Content Security Policy hash (Csp.targets).
      # Done here, without tokens, for the runs that don't deploy (Dependabot's pull requests, forks'), so a change that
      # breaks it fails before it is merged. Every other run publishes in the deploy job and checks the same there.
      - name: Check that the site publishes
        if: env.DEPLOYS != 'true'
        run: |
          dotnet publish Client --configuration Release --output "$RUNNER_TEMP/publish"
          node .github/scripts/check-published-csp.mjs "$RUNNER_TEMP/publish/wwwroot"

  # Production gets the public token only. On pushes to main, the "editor" environment, which the Storyblok Visual Editor
  # previews, is also built with the preview token. That token reads drafts and ships inside the app, so it must
  # never be part of the production build.
  build_and_deploy_job:
    needs: build_job
    # Dependabot's pull requests and pull requests from forks get no secrets, so they're built but not deployed.
    # The pull request's author decides, not who started the run: a re-run of Dependabot's pull request still has no secrets.
    # Every other run deploys production, so only from main: a run started by hand on another branch is only built.
    if: >-
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
      (github.event.action != 'closed' &&
       github.event.pull_request.user.login != 'dependabot[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # Without it, publish ships the .NET runtime's WebAssembly file as it comes; with it, the file is relinked for
      # this app and smaller.
      # Also tells the build that they're there (Client.csproj turns on the options that need them).
      - name: Install the WebAssembly build tools
        run: |
          dotnet workload install wasm-tools
          echo "WASM_TOOLS_INSTALLED=true" >> "$GITHUB_ENV"

      # jq writes the values as JSON strings, so characters such as & or # in a token arrive unchanged.
      - name: Publish the site with the public token
        env:
          APPSETTINGS_PATH: Client/wwwroot/appsettings.json
          STORYBLOK_API_KEY_PUBLIC: ${{ secrets.STORYBLOK_API_KEY_PUBLIC }}
        run: |
          if [ -z "$STORYBLOK_API_KEY_PUBLIC" ]; then
            echo "::error::The STORYBLOK_API_KEY_PUBLIC secret is not available."
            exit 1
          fi
          jq --arg public "$STORYBLOK_API_KEY_PUBLIC" '.Storyblok.ApiKeyPublic = $public' \
            "$APPSETTINGS_PATH" > "$RUNNER_TEMP/appsettings.json"
          mv "$RUNNER_TEMP/appsettings.json" "$APPSETTINGS_PATH"
          dotnet publish Client --configuration Release --output publish/site

      # Puts the home page's content and the profile from Storyblok into the published index.html and cuts Font Awesome
      # down to the icons in use (the Prerender project, see the README's Deployment section). It never fails the deploy:
      # whatever goes wrong, it warns and leaves the site as published. fonttools (pyftsubset) is installed exactly as
      # Prerender/requirements.txt pins it, hashes included, into a virtual environment of its own.
      - name: Prerender the home page
        run: |
          if python3 -m venv "$RUNNER_TEMP/fonttools" \
            && "$RUNNER_TEMP/fonttools/bin/pip" install --quiet --require-hashes -r Prerender/requirements.txt; then
            export PATH="$RUNNER_TEMP/fonttools/bin:$PATH"
          else
            echo "::warning::fonttools couldn't be installed; Font Awesome ships whole."
          fi
          dotnet run --project Prerender --configuration Release -- publish/site/wwwroot

      # The prerendered page is a different page from the one Csp.targets hashed: check it against the policy before
      # it goes live. A failure stops here, and the site stays as last deployed.
      - name: Check the pages against the Content Security Policy
        run: node .github/scripts/check-published-csp.mjs publish/site/wwwroot

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_TREE_0C2E88D03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "publish/site/wwwroot"
          api_location: ""
          output_location: ""
          skip_app_build: true

      # Every run on main, also those a publish in Storyblok starts: such a run may have replaced a push's run before
      # that one reached this step.
      - name: Publish the editor build with the preview token
        if: github.event_name != 'pull_request'
        env:
          APPSETTINGS_PATH: Client/wwwroot/appsettings.json
          STORYBLOK_API_KEY_PREVIEW: ${{ secrets.STORYBLOK_API_KEY_PREVIEW }}
        run: |
          if [ -z "$STORYBLOK_API_KEY_PREVIEW" ]; then
            echo "::error::The STORYBLOK_API_KEY_PREVIEW secret is not available."
            exit 1
          fi
          jq --arg preview "$STORYBLOK_API_KEY_PREVIEW" '.Storyblok.ApiKeyPreview = $preview' \
            "$APPSETTINGS_PATH" > "$RUNNER_TEMP/appsettings.json"
          mv "$RUNNER_TEMP/appsettings.json" "$APPSETTINGS_PATH"
          dotnet publish Client --configuration Release --output publish/editor
          node .github/scripts/check-published-csp.mjs publish/editor/wwwroot

      # A named preview environment: https://<app>-editor.<region>.azurestaticapps.net. Storyblok's preview URL points here.
      - name: Deploy the editor build
        if: github.event_name != 'pull_request'
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_TREE_0C2E88D03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "publish/editor/wwwroot"
          api_location: ""
          output_location: ""
          skip_app_build: true
          deployment_environment: "editor"

  # Removes the pull request's staging environment; Azure doesn't do this on its own. Pull requests that were never
  # deployed (Dependabot's, forks') have none.
  close_pull_request_job:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close staging environment
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_TREE_0C2E88D03 }}
          action: "close"
