name: Azure Static Web Apps CI/CD
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  # Storyblok dispatches this workflow on main after a content publish.
  workflow_dispatch:

# A Storyblok publish can supersede a push to main, so both runs rebuild the editor site.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_job:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build Job
    env:
      # Runs that deploy check publishing in the deploy job.
      DEPLOYS: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || (github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The committed stylesheet serves local development. CI uses the rebuilt copy.
      - name: Check that app.css is up to date
        run: |
          .github/scripts/build-app-css.sh "$RUNNER_TEMP/app.css"
          if ! cmp --silent "$RUNNER_TEMP/app.css" Client/wwwroot/css/app.css; then
            echo "::warning file=Client/wwwroot/css/app.css::Rebuild app.css as described in the README and commit the result."
            cp "$RUNNER_TEMP/app.css" Client/wwwroot/css/app.css
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Install the WebAssembly build tools
        if: env.DEPLOYS != 'true'
        run: |
          dotnet workload install wasm-tools
          echo "WASM_TOOLS_INSTALLED=true" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          # Restoring the API directly also restores its generated Functions extension project.
          dotnet restore Api/Api.csproj
          dotnet test --solution link-in-bio.slnx --configuration Release

      - name: Test the JavaScript
        run: |
          npm ci --ignore-scripts
          node --test "Tests/js/*.test.mjs"

      # Exercise the full publish on PRs that cannot deploy.
      - name: Check that the site and the API publish
        if: env.DEPLOYS != 'true'
        run: |
          dotnet publish Client --configuration Release --output "$RUNNER_TEMP/publish"
          node .github/scripts/check-published-csp.mjs "$RUNNER_TEMP/publish/wwwroot"
          dotnet publish Api --configuration Release --output "$RUNNER_TEMP/publish-api"

  build_and_deploy_job:
    needs: build_job
    # Check the PR author so rerunning a Dependabot PR still skips deployment.
    if: >-
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
      (github.event.action != 'closed' &&
       github.event.pull_request.user.login != 'dependabot[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install CSP checker dependencies
        run: npm ci --ignore-scripts

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Install the WebAssembly build tools
        run: |
          dotnet workload install wasm-tools
          echo "WASM_TOOLS_INSTALLED=true" >> "$GITHUB_ENV"

      - name: Build app.css
        run: .github/scripts/build-app-css.sh Client/wwwroot/css/app.css

      - name: Publish the site with the public token
        env:
          APPSETTINGS_PATH: Client/wwwroot/appsettings.json
          STORYBLOK_API_KEY_PUBLIC: ${{ secrets.STORYBLOK_API_KEY_PUBLIC }}
        run: |
          if [ -z "$STORYBLOK_API_KEY_PUBLIC" ]; then
            echo "::error::The STORYBLOK_API_KEY_PUBLIC secret is not available."
            exit 1
          fi
          jq --arg public "$STORYBLOK_API_KEY_PUBLIC" '.Storyblok.ApiKeyPublic = $public' \
            "$APPSETTINGS_PATH" > "$RUNNER_TEMP/appsettings.json"
          mv "$RUNNER_TEMP/appsettings.json" "$APPSETTINGS_PATH"
          dotnet publish Client --configuration Release --output publish/site

      - name: Prerender the home page
        run: |
          if python3 -m venv "$RUNNER_TEMP/fonttools" \
            && "$RUNNER_TEMP/fonttools/bin/pip" install --quiet --require-hashes -r Prerender/requirements.txt; then
            export PATH="$RUNNER_TEMP/fonttools/bin:$PATH"
          else
            echo "::warning::fonttools couldn't be installed; Font Awesome ships whole."
          fi
          dotnet run --project Prerender --configuration Release -- publish/site/wwwroot

      # Prerendering changes the HTML after publish generates its CSP hashes.
      - name: Check the pages against the Content Security Policy
        run: node .github/scripts/check-published-csp.mjs publish/site/wwwroot

      - name: Publish the API
        run: dotnet publish Api --configuration Release --output publish/api

      # Azure copies production settings to PR environments. Keep the API and its credentials in production.
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_TREE_0C2E88D03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "publish/site/wwwroot"
          api_location: ${{ github.event_name != 'pull_request' && 'publish/api' || '' }}
          output_location: ""
          skip_app_build: true
          skip_api_build: true

      # The preview token grants draft access. Add it only after publishing the public site.
      - name: Publish the editor build with the preview token
        if: github.event_name != 'pull_request'
        env:
          APPSETTINGS_PATH: Client/wwwroot/appsettings.json
          STORYBLOK_API_KEY_PREVIEW: ${{ secrets.STORYBLOK_API_KEY_PREVIEW }}
        run: |
          if [ -z "$STORYBLOK_API_KEY_PREVIEW" ]; then
            echo "::error::The STORYBLOK_API_KEY_PREVIEW secret is not available."
            exit 1
          fi
          jq --arg preview "$STORYBLOK_API_KEY_PREVIEW" '.Storyblok.ApiKeyPreview = $preview' \
            "$APPSETTINGS_PATH" > "$RUNNER_TEMP/appsettings.json"
          mv "$RUNNER_TEMP/appsettings.json" "$APPSETTINGS_PATH"
          dotnet publish Client --configuration Release --output publish/editor
          node .github/scripts/check-published-csp.mjs publish/editor/wwwroot

      - name: Deploy the editor build
        if: github.event_name != 'pull_request'
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_TREE_0C2E88D03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "publish/editor/wwwroot"
          api_location: ""
          output_location: ""
          skip_app_build: true
          deployment_environment: "editor"

  close_pull_request_job:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close staging environment
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_TREE_0C2E88D03 }}
          action: "close"
