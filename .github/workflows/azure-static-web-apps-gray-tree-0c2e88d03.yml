name: Azure Static Web Apps CI/CD
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

# A newer push to the same branch or pull request replaces a run still in progress: the last deploy would win anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      # jq writes the values as JSON strings, so characters such as & or # in a token arrive unchanged.
      - name: Write Storyblok tokens into appsettings.json
        env:
          APPSETTINGS_PATH: Client/wwwroot/appsettings.json
          STORYBLOK_API_KEY_PUBLIC: ${{ secrets.STORYBLOK_API_KEY_PUBLIC }}
          STORYBLOK_API_KEY_PREVIEW: ${{ secrets.STORYBLOK_API_KEY_PREVIEW }}
        run: |
          if [ -z "$STORYBLOK_API_KEY_PUBLIC" ]; then
            echo "::error::The STORYBLOK_API_KEY_PUBLIC secret is not available (pull requests from forks don't get secrets)."
            exit 1
          fi
          jq --arg public "$STORYBLOK_API_KEY_PUBLIC" --arg preview "$STORYBLOK_API_KEY_PREVIEW" \
            '.Storyblok.ApiKeyPublic = $public | .Storyblok.ApiKeyPreview = $preview' \
            "$APPSETTINGS_PATH" > "$RUNNER_TEMP/appsettings.json"
          mv "$RUNNER_TEMP/appsettings.json" "$APPSETTINGS_PATH"

      - name: Publish Blazor WASM
        run: dotnet publish Client -c Release -o Client/bin/Release/net11/publish

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_TREE_0C2E88D03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "Client/bin/Release/net11/publish/wwwroot"
          api_location: ""
          output_location: ""
          skip_app_build: true

  # Removes the pull request's staging environment; Azure doesn't do this on its own.
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close staging environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_TREE_0C2E88D03 }}
          action: "close"
