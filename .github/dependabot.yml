# See the README for manual updates to Client/wwwroot/lib.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dotnet:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.Extensions.*"
      # Review major Azure Functions upgrades individually.
      azure-functions:
        update-types: ["minor", "patch"]
        patterns:
          - "Microsoft.Azure.Functions.*"

  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"

  # The deploy uses these tools to subset Font Awesome.
  - package-ecosystem: "pip"
    directory: "/Prerender"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
