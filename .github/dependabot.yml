# Dependabot's pull requests get no repository secrets, so CI builds them but doesn't deploy them.
# The libraries in Client/wwwroot/lib are not covered; the README says how to update them.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # .NET's packages are released together, so they arrive as one pull request.
      dotnet:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.Extensions.*"

  # The SDK pinned in global.json, which CI installs too: a new release arrives as a pull request instead of silently.
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"

  # fonttools and brotli, which the deploy uses to cut Font Awesome down (Prerender/requirements.txt). Dependabot updates
  # the versions and their hashes together.
  - package-ecosystem: "pip"
    directory: "/Prerender"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
