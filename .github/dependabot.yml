# Dependabot's pull requests get no repository secrets, so CI builds them but doesn't deploy them.
# The libraries in Client/wwwroot/lib are not covered; the README says how to update them.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # .NET's packages are released together, so they arrive as one pull request.
      dotnet:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.Extensions.*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
